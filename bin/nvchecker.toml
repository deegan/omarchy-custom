# Per-package "what's the latest upstream version" checks, used by
# bin/check-updates. One [section] per pkgbuilds/<name>/ directory; the
# section's version must come out in the same form as that PKGBUILD's $pkgver.
#
# Every new package added under pkgbuilds/ needs a section here, otherwise
# bin/check-updates silently never checks it.

[__config__]
# nvchecker only writes `newver` when `oldver` is also set. bin/check-updates
# deletes both before every run and does its own comparison against each
# PKGBUILD's pkgver, so neither is meant to persist state between runs.
oldver = ".nvchecker-oldver.json"
newver = ".nvchecker-newver.json"

[goxlr-utility]
source = "github"
github = "GoXLR-on-Linux/goxlr-utility"
use_latest_release = true
prefix = "v"

[cairn-tracker]
# no GitHub token needed: plain `git ls-remote` on the tags
source = "git"
git = "https://github.com/Ratpido-dev/cairn.git"
prefix = "v"
